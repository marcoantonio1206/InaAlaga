# Supabase Configuration for InaAlaga
# This file configures the local development setup

project_id = "inaalaga"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
min_password_length = 8
password_requirements = ""

[auth.email]
enable_signup = false
enable_confirmations = false
secure_email_change = false
double_confirm_changes = false
otp_length = 6
otp_expiry = 600

[auth.sms]
enable_signup = false
enable_confirmations = false
otp_length = 6
otp_expiry = 600

[auth.external]
# No external providers for demo

[storage]
enabled = false

[realtime]
enabled = true
ip_version = "ipv4"
port = 54328

[edge_runtime]
enabled = false

[functions]
enabled = false

[logs]
enabled = true